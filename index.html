<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas del Día</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin:0;
            padding:0;
            background:#f8f8f8;
        }
        header {
            background:#ff4500;
            color:white;
            text-align:center;
            padding:20px;
        }
        .container {
            max-width:1000px;
            margin:30px auto;
            padding:0 20px;
        }
        .oferta {
            background:white;
            padding:20px;
            margin:15px 0;
            border-radius:8px;
        }
        .precio {
            color:#ff4500;
            font-size:22px;
            font-weight:bold;
        }
        .boton {
            display:inline-block;
            background:#ff4500;
            color:white;
            padding:10px 20px;
            border-radius:5px;
            text-decoration:none;
        }
        .aviso {
            background:#eef;
            padding:15px;
            border-radius:8px;
            margin:30px 0;
            font-size:14px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🔥 Ofertas del Día 🔥</h1>
        <p>Las mejores ofertas actualizadas cada día</p>
    </header>
    <div class="container">
        <div class="oferta">
            <h2>Producto Ejemplo</h2>
            <p>Descripción del producto en oferta</p>
            <p class="precio">$XX.XX</p>
            <a href="PONER_ENLACE_AMAZON_AQUI" class="boton">Ver en Amazon</a>
        </div>
        <div class="aviso">
            <p><strong>Aviso afiliado:</strong> Podemos recibir una comisión si compras a través de estos enlaces sin costo adicional para ti.</p>
        </div>
    </div>
</body>
</html>
